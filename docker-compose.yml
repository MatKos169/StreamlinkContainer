# recorder  - polls Twitch, records live channels into WORK_PATH (runs on its own)
# converter - turns finished recordings into MP4 with chapters, moves them to RECORDINGS_PATH
#             (scale with `docker compose up -d --scale converter=2`, or run more on other
#             hosts with docker-compose.converter.yml and the same shares)
# web       - UI for channels and settings; can be stopped without affecting recordings
x-common: &common
  user: "${PUID:-1027}:${PGID:-100}"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  env_file:
    - default.env

services:
  recorder:
    <<: *common
    image: streamlink-recorder:local
    build:
      context: .
      target: runner
    container_name: streamlink-recorder
    env_file:
      - default.env
      - clientid.env
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${WORK_PATH:-./work}:/work
    # Give running recordings time to close their files on `docker compose down`.
    stop_grace_period: 1m
    healthcheck:
      # status.json is rewritten at least every 30s; stale means the loop is stuck.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/config/status.json') > 120)"]
      interval: 1m
      start_period: 2m
    deploy:
      resources:
        limits:
          memory: 1G

  converter:
    <<: *common
    image: streamlink-converter:local
    build:
      context: .
      target: converter
    environment:
      # Shown in the web UI; defaults to the container's hostname.
      CONVERTER_NAME: ${CONVERTER_NAME:-}
    volumes:
      - ${WORK_PATH:-./work}:/work
      - ${RECORDINGS_PATH:-./recordings}:/recordings
    # An interrupted conversion goes back to the queue.
    stop_grace_period: 40s

  web:
    <<: *common
    image: streamlink-recorder:local
    container_name: streamlink-web
    command: ["python", "-m", "app.web"]
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${WORK_PATH:-./work}:/work
    ports:
      - "${WEB_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 128M
