# Two containers sharing ./config:
#   recorder - polls Twitch and records all enabled channels (runs on its own)
#   web      - UI to add/remove channels; can be stopped without affecting recordings
x-common: &common
  image: streamlink-recorder:local
  build: .
  user: "${PUID:-1027}:${PGID:-100}"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  recorder:
    <<: *common
    container_name: streamlink-recorder
    env_file:
      - default.env
      - clientid.env
    volumes:
      - ${CONFIG_PATH:-./config}:/config
      - ${RECORDINGS_PATH:-./recordings}:/recordings
    # Give running recordings time to close their files on `docker compose down`.
    stop_grace_period: 1m
    healthcheck:
      # status.json is rewritten on every check; stale means the loop is stuck.
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/config/status.json') > 120)"]
      interval: 1m
      start_period: 2m
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    <<: *common
    container_name: streamlink-web
    command: ["python", "-m", "app.web"]
    env_file:
      - default.env
    volumes:
      - ${CONFIG_PATH:-./config}:/config
    ports:
      - "${WEB_PORT:-8080}:8080"
    deploy:
      resources:
        limits:
          memory: 128M
